name: Build and Publish TurboWarp Image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/turbowarp-image.yml"
      - "containers/turbowarp/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/turbowarp
          tags: |
            type=raw,value=latest
            type=raw,value=upstream-a2946ee
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=TurboWarp
            org.opencontainers.image.description=Pinned TurboWarp GUI static web image using LinuxServer.io nginx runtime
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: containers/turbowarp
          file: containers/turbowarp/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TURBOWARP_REF=a2946eeb9a9dca7857d7ab53d766b54288c7a2ff
            LSIO_NGINX_TAG=1.30.4-r1-ls369

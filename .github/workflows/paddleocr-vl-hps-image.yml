name: Build and Publish PaddleOCR-VL HPS Images

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/paddleocr-vl-hps-image.yml"
      - "containers/paddleocr-vl-hps/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: paddleocr-vl-gateway
            context: containers/paddleocr-vl-hps/gateway
            file: containers/paddleocr-vl-hps/gateway/Dockerfile
            title: PaddleOCR-VL HPS Gateway
            description: PaddleOCR-VL high-performance FastAPI gateway
          - name: paddleocr-vl-pipeline
            context: containers/paddleocr-vl-hps/pipeline
            file: containers/paddleocr-vl-hps/pipeline/Dockerfile
            title: PaddleOCR-VL HPS Pipeline
            description: PaddleOCR-VL high-performance Triton pipeline server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=${{ matrix.image.title }}
            org.opencontainers.image.description=${{ matrix.image.description }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

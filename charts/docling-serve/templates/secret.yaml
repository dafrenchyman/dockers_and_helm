{{- if and (eq .Values.computeEngine.type "rq") (not .Values.redis.external.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "docling-serve.fullname" . }}-secret
  labels:
    {{- include "docling-serve.labels" . | nindent 4 }}
type: Opaque
data:
  # Redis password (base64 encoded empty string for embedded Redis without auth)
  redis-password: {{ "" | b64enc | quote }}
{{- else if and (eq .Values.computeEngine.type "rq") .Values.redis.external.enabled .Values.redis.external.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "docling-serve.fullname" . }}-secret
  labels:
    {{- include "docling-serve.labels" . | nindent 4 }}
type: Opaque
data:
  # External Redis password
  redis-password: {{ .Values.redis.external.password | b64enc | quote }}
{{- end }}
